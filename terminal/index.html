<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="An interactive portfolio terminal for Bhavish B N." />
  <title>Portfolio Terminal · Bhavish B N</title>
  <style>
    :root { color-scheme:dark; --bg:#0b0d10; --panel:#11151b; --edge:#252b34; --text:#e6edf3; --muted:#8b949e; --orange:#f97316; --green:#8fe3ad; --blue:#82b8ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:20px 14px; background:radial-gradient(ellipse at 50% -10%,#242019 0%,var(--bg) 58%); color:var(--text); font:15px/1.55 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
    main { width:min(100%,850px); }
    .label { margin:0 0 10px; color:var(--orange); font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(25px,6vw,38px)/1.2 system-ui,sans-serif; letter-spacing:-.04em; }
    .intro { margin:8px 0 18px; color:var(--muted); font:14px/1.5 system-ui,sans-serif; }
    .terminal { overflow:hidden; border:1px solid var(--edge); border-radius:14px; background:var(--panel); box-shadow:0 26px 80px #0008; }
    .chrome { display:flex; align-items:center; gap:7px; height:42px; padding:0 14px; border-bottom:1px solid var(--edge); color:var(--muted); font:12px system-ui,sans-serif; }
    .light { width:10px; height:10px; border-radius:50%; background:#ff5f57; }
    .light:nth-child(2) { background:#febc2e; }.light:nth-child(3) { background:#28c840; }
    .title { margin-left:8px; }
    #output { min-height:270px; max-height:52vh; overflow-y:auto; padding:18px 18px 10px; scrollbar-color:#39414c transparent; }
    .line { margin:0 0 9px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .system { color:var(--muted); }.prompt-line { color:var(--text); }.cmd { color:var(--orange); }.success { color:var(--green); }
    a { color:var(--blue); text-underline-offset:3px; }.line a { overflow-wrap:anywhere; }
    form { display:flex; align-items:center; gap:9px; min-height:52px; margin:0 18px; border-top:1px solid var(--edge); }
    .prompt { flex:0 0 auto; color:var(--orange); font-weight:700; }
    input { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; caret-color:var(--orange); }
    input::placeholder { color:#66717e; }
    .help { display:flex; flex-wrap:wrap; gap:8px; margin:13px 0 0; }
    .help button { border:1px solid var(--edge); border-radius:999px; padding:5px 10px; background:#11151b; color:#c4cbd4; font:12px ui-monospace,SFMono-Regular,Consolas,monospace; cursor:pointer; }
    .help button:hover,.help button:focus-visible { border-color:var(--orange); color:var(--orange); }
    .back { display:inline-block; margin-top:19px; color:var(--muted); font:13px system-ui,sans-serif; text-decoration:none; }
    .back:hover { color:var(--orange); }
    @media(max-width:520px) { #output { min-height:230px; padding:14px 13px 8px; } form { margin:0 13px; } }
  </style>
</head>
<body>
  <main>
    <p class="label">Bhavish B N · portfolio access</p>
    <h1>Interactive terminal<span style="color:var(--orange)">.</span></h1>
    <p class="intro">Type a command below, or tap one of the quick commands. This terminal is a small portfolio guide; it does not run system commands.</p>
    <section class="terminal" aria-label="Interactive portfolio terminal">
      <div class="chrome"><span class="light"></span><span class="light"></span><span class="light"></span><span class="title">guest@bhavish — portfolio</span></div>
      <div id="output" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form id="command-form" autocomplete="off">
        <label class="prompt" for="command-input">guest@bhavish:~$</label>
        <input id="command-input" name="command" type="text" spellcheck="false" autocapitalize="off" placeholder="type help and press Enter" aria-label="Enter a portfolio command" autofocus />
      </form>
    </section>
    <nav class="help" aria-label="Quick commands">
      <button type="button" data-command="help">help</button>
      <button type="button" data-command="about">about</button>
      <button type="button" data-command="projects">projects</button>
      <button type="button" data-command="review">review</button>
      <button type="button" data-command="clear">clear</button>
    </nav>
    <a class="back" href="https://github.com/Bhavish49">← Back to GitHub profile</a>
  </main>
  <script>
    (() => {
      const output=document.querySelector('#output');
      const form=document.querySelector('#command-form');
      const input=document.querySelector('#command-input');
      const repoUrl='https://github.com/Bhavish49?tab=repositories';
      const profileUrl='https://github.com/Bhavish49';
      function line(text='',kind='system',link=null){
        const row=document.createElement('p');row.className=`line ${kind}`;
        if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noreferrer';a.textContent=text;row.append(a);}
        else row.textContent=text;
        output.append(row);output.scrollTop=output.scrollHeight;
      }
      function run(raw){
        const command=raw.trim().toLowerCase();
        if(!command)return;
        line(`guest@bhavish:~$ ${raw}`,'prompt-line');
        switch(command){
          case 'help': line('Available commands: about · projects · review · contact · clear');break;
          case 'about': line('Bhavish B N · GitHub profile: Bhavish49');line('A place for projects, experiments, and things I am learning.');break;
          case 'projects': line('Opening the repository list…','success',repoUrl);break;
          case 'review': line('I’d appreciate your feedback. Browse the repositories and tell me what I can improve.');line('Review my repositories ↗','success',repoUrl);break;
          case 'contact': line('Open my GitHub profile to connect.','success',profileUrl);break;
          case 'clear': output.replaceChildren();break;
          default: line(`Command not found: ${raw}. Type help to see available commands.`);
        }
      }
      line('Welcome. Type help to get started.','success');
      form.addEventListener('submit',e=>{e.preventDefault();run(input.value);input.value='';});
      document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>{run(button.dataset.command);input.focus();}));
      document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus();}});
    })();
  </script>
</body>
</html>
