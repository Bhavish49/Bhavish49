<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="A tiny gyro-controlled Snake game by Bhavish B N." />
  <title>Gyro Snake · Bhavish B N</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#0e1b2c; --line:#1c3048; --ink:#e7f0fc; --muted:#91a5bd; --mint:#72f0c1; --blue:#77aaff; --red:#ff7185; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px 14px; background:radial-gradient(ellipse at 50% 0%,#132843 0%,var(--bg) 62%); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,520px); }
    .eyebrow { color:var(--mint); font:700 12px/1.2 ui-monospace,SFMono-Regular,monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:8px 0 4px; font-size:clamp(32px,8vw,48px); line-height:1; letter-spacing:-.055em; }
    .sub { margin:0 0 20px; color:var(--muted); }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:linear-gradient(145deg,#102036,var(--panel)); box-shadow:0 24px 70px #0007; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
    .score-label { color:var(--muted); font:700 11px ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; }
    #score { color:var(--mint); font:700 22px ui-monospace,SFMono-Regular,monospace; }
    .state { color:var(--muted); font-size:13px; text-align:right; }
    .board-wrap { padding:12px; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:1; border-radius:12px; background:#081422; touch-action:none; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px 12px; }
    button { min-height:48px; border:1px solid #31506d; border-radius:12px; padding:10px 14px; background:#152943; color:var(--ink); font:700 14px system-ui,sans-serif; cursor:pointer; touch-action:manipulation; }
    button.primary { border-color:transparent; background:var(--mint); color:#062018; }
    button:active { transform:translateY(1px); }
    .help { display:flex; gap:12px; align-items:flex-start; margin:14px 2px 0; color:var(--muted); font-size:13px; }
    .dot { flex:0 0 8px; width:8px; height:8px; margin-top:6px; border-radius:50%; background:var(--blue); box-shadow:0 0 12px var(--blue); }
    .back { display:inline-block; margin-top:18px; color:var(--muted); font-size:13px; text-decoration:none; }
    .back:hover { color:var(--mint); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Bhavish B N · Mini project 01</div>
    <h1>Gyro Snake<span style="color:var(--mint)">.</span></h1>
    <p class="sub">Tilt your phone. Guide the snake. Grab the signal.</p>

    <section class="panel" aria-label="Snake game">
      <div class="toolbar">
        <div><div class="score-label">SCORE</div><div id="score" aria-live="polite">00</div></div>
        <div class="state" id="state" aria-live="polite">Press Start to play</div>
      </div>
      <div class="board-wrap"><canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas></div>
      <div class="controls">
        <button class="primary" id="start">Start game</button>
        <button id="gyro">Enable gyro</button>
      </div>
    </section>

    <p class="help"><span class="dot"></span><span><strong>Phone:</strong> tap Enable gyro, allow motion access, then tilt to steer. <strong>Computer:</strong> use arrow keys or WASD. Swipe on the board also works.</span></p>
    <a class="back" href="https://github.com/Bhavish49">← Back to Bhavish’s GitHub</a>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const stateEl = document.querySelector('#state');
      const startBtn = document.querySelector('#start');
      const gyroBtn = document.querySelector('#gyro');
      const cells = 20, size = canvas.width / cells;
      let snake, direction, queued, food, score, timer, running = false, gyroOn = false;

      function reset() {
        snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}]; direction={x:1,y:0}; queued={...direction};
        score=0; scoreEl.textContent='00'; placeFood(); draw();
      }
      function placeFood() {
        do { food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}; }
        while (snake.some(p=>p.x===food.x&&p.y===food.y));
      }
      function draw() {
        ctx.fillStyle='#081422'; ctx.fillRect(0,0,400,400);
        ctx.strokeStyle='#10243a'; ctx.lineWidth=1;
        for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,400);ctx.moveTo(0,i*size);ctx.lineTo(400,i*size);ctx.stroke();}
        ctx.fillStyle='#ff7185'; ctx.shadowColor='#ff7185'; ctx.shadowBlur=18;
        ctx.beginPath();ctx.arc((food.x+.5)*size,(food.y+.5)*size,size*.29,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#72f0c1':'#38b895';ctx.beginPath();ctx.roundRect(p.x*size+2,p.y*size+2,size-4,size-4,5);ctx.fill();});
        const h=snake[0], ex=(h.x+.5)*size+direction.x*4, ey=(h.y+.5)*size+direction.y*4;
        ctx.fillStyle='#07111f';ctx.beginPath();ctx.arc(ex-direction.y*4,ey+direction.x*4,1.8,0,7);ctx.arc(ex+direction.y*4,ey-direction.x*4,1.8,0,7);ctx.fill();
      }
      function tick() {
        direction=queued;
        const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
        if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||snake.some((p,i)=>i>0&&p.x===head.x&&p.y===head.y)) return gameOver();
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=String(score).padStart(2,'0');placeFood();}
        else snake.pop();
        draw();
      }
      function gameOver(){running=false;clearInterval(timer);stateEl.textContent=`Game over · score ${score}`;startBtn.textContent='Play again';}
      function start(){clearInterval(timer);reset();running=true;stateEl.textContent=gyroOn?'Gyro on · tilt to steer':'Use arrows, WASD, or swipe';startBtn.textContent='Restart';timer=setInterval(tick,125);}
      function turn(x,y){if(x===-direction.x&&y===-direction.y)return;queued={x,y};}
      const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
      addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();turn(...keys[e.key]);}});
      let touchStart=null;
      canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};});
      canvas.addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));});
      function onOrientation(e){if(!running||e.gamma==null||e.beta==null)return;const x=e.gamma,y=e.beta;if(Math.max(Math.abs(x),Math.abs(y))<12)return;if(Math.abs(x)>Math.abs(y))turn(Math.sign(x),0);else turn(0,Math.sign(y));}
      gyroBtn.addEventListener('click',async()=>{
        if(!('DeviceOrientationEvent'in window)){stateEl.textContent='Motion sensors are not available in this browser';return;}
        try {
          if(typeof DeviceOrientationEvent.requestPermission==='function'){
            const permission=await DeviceOrientationEvent.requestPermission();
            if(permission!=='granted'){stateEl.textContent='Motion access was not allowed';return;}
          }
          addEventListener('deviceorientation',onOrientation);gyroOn=true;gyroBtn.textContent='Gyro enabled';
          stateEl.textContent=running?'Gyro on · tilt to steer':'Gyro ready · press Start';
        } catch {stateEl.textContent='Could not enable motion · use arrows or swipe';}
      });
      startBtn.addEventListener('click',start);
      reset();
    })();
  </script>
</body>
</html>
